"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# This is the landing project of the Sphinx-Needs demo repo.
# It only holds explanatory pages and links out to the four independent demo
# projects, each with its own ubproject.toml:
#   basic_example/ubproject.toml
#   coffee-machine/ubproject.toml
#   automotive-adas/ubproject.toml
#   safety_example/ubproject.toml
# This project itself defines no Sphinx-Needs types, so there is no [needs] table.
# For details see https://ubcode.useblocks.com

[server]
index_on_save = true

[project]
name = "Sphinx-Needs Demo"
description = "Landing page for the Sphinx-Needs Demo playground"
srcdir = "."

# ubc's own file discovery (independent of Sphinx's conf.py exclude_patterns,
# which does the equivalent job for the actual Sphinx build). Without this,
# `ubc check docs/` recurses into the 4 independent sub-projects too and
# checks their .rst files against this project's config (which has no
# [needs] table at all), reporting every need directive there as unknown.
[source]
extend_exclude = [
  "basic_example",
  "coffee-machine",
  "automotive-adas",
  "safety_example",
  # Excluded from the actual Sphinx build too (see conf.py exclude_patterns):
  # demo_page_header.rst is a jinja-included partial, not a standalone page,
  # and demo_hints/ is dead/orphaned content kept only for historical reasons.
  "demo_page_header.rst",
  "demo_hints",
]

[format_rst]
fail_on_warning = []
validate = true
blockquote_indent = 2
definition_list_indent = 2
directive_indent = 3
enum_list_auto = "preserve"
enum_list_style = "preserve"
field_list_align_body = false
field_list_body_on_new_line = 20
field_list_indent = 2
literal_indent = 2
paragraph_line_length = 70
paragraph_semantic_wrap = false
simple_table_space = 2
substitution_indent = 3
transition_char = "-"
transition_length = 10

[parse.extend_directives.if-builder]
# see https://sphinx-simplepdf.readthedocs.io/en/latest/directives.html#if-builder
description = "Sphinx-SimplePDF builder specific content"
argument = true
argument_required = true
content = true
content_required = true
options = false

[parse.extend_directives.button-link]
# see https://sphinx-design.readthedocs.io/en/latest/badges_buttons.html#buttons
# Required on ubc <= 0.31.0 (button-link isn't a built-in there, and without
# this it's a hard "unknown directive" error). On newer ubc versions
# button-link is built in and this declaration just conflicts with (and is
# ignored in favor of) that built-in - hence the message-ignore below.
description = "Sphinx-Design button with link"
argument = true
argument_required = true
content = true
content_required = true
options = true

# ubCode setting: run a script command
[scripts]
sphinx = "sphinx-build -b html . _build/html"
