name: CI
on:
  pull_request:
jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install graphviz
        run: sudo apt-get install -y graphviz
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Build docs
        run: uv run sphinx-build -W -b html -D needs_variant_data_file=variants/eu_left.json . _build/html
        working-directory: docs
      - name: Build ubtrace
        run: uv run sphinx-build -W -b ubtrace -D needs_variant_data_file=variants/eu_left.json . _build/ubtrace
        working-directory: docs
  ubc:
    name: ubc
    runs-on: ubuntu-latest
    # Non-blocking: ubc does not yet support the `if` directive (variant blocks)
    # and reports false positives. Keep the job for visibility without failing CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: useblocks/ubc-action@0.1
        with:
          version: "0.30.3"
          working-directory: docs
      - name: Run 'ubc check .'
        run: ubc check .
