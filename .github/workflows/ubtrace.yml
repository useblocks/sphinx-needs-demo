name: ubTrace publish

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and deploy (tag name or "main")'
        required: true
        default: 'main'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install graphviz
        run: sudo apt-get install -y graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Compute UBTRACE_VERSION
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ github.event.inputs.ref }}"
            if [[ "$ref" == "main" ]]; then
              version="main"
            else
              version="$ref"
            fi
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="main"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and upload all variants to ubTrace
        env:
          UBTRACE_INGEST_TOKEN: ${{ secrets.UBTRACE_INGEST_TOKEN }}
          UBTRACE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          # Build each ADAS variant and upload it individually. All variants build
          # into the same output directory, so each build must be uploaded before
          # the next one overwrites it. The variant dimensions (area/steering) are
          # written into ubtrace_project.toml and keep the uploads distinct on the
          # ubTrace server.
          for variant in eu_left eu_right america; do
            echo "::group::Build variant ${variant}"
            uv run sphinx-build -b ubtrace \
              -D ubtrace_version=${{ steps.vars.outputs.version }} \
              -D needs_variant_data_file=variants/${variant}.json \
              docs docs/_build/ubtrace
            echo "::endgroup::"
            echo "::group::Upload variant ${variant}"
            bash upload.sh
            echo "::endgroup::"
          done
