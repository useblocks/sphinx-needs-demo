# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  apt_packages:
    - default-jdk
    - graphviz
  tools:
    python: "3.12"
    # You can also specify other tool versions:
    # nodejs: "19"
    # rust: "1.64"
    # golang: "1.19"
  jobs:
    pre_create_environment:
      - echo "DOT details"
      - which dot
    post_create_environment:
      # ubt-sphinx and ubt-runtime are only available on the private
      # pypi.useblocks.com index, not on PyPI. RTD's pip install uses PyPI by
      # default, so we pre-install both here before the main install runs -
      # otherwise `pip install .` fails to resolve them and aborts before
      # installing anything at all (including sphinx-needs itself).
      - pip install --extra-index-url https://pypi.useblocks.com/ "ubt-sphinx==0.8.1" "ubt-runtime==0.6.0"
    post_install:
      # The `python.install` config below does NOT actually run once
      # build.jobs.build.html is set (confirmed from an actual RTD build's
      # command list: pip install . never appeared, only this job's own
      # commands did, and the build then failed with "No module named
      # sphinx_needs"). So install this project's real dependencies
      # explicitly here instead of relying on python.install to do it.
      - pip install .
    build:
      html:
        # docs/ now holds five independent Sphinx projects (their own
        # conf.py/ubproject.toml each). This repo's build.commands
        # replaces RTD's built-in single-project sphinx build so all five
        # get built with the same shared script CI uses, side by side
        # under $READTHEDOCS_OUTPUT/html/.
        - scripts/build_docs.sh "$READTHEDOCS_OUTPUT/html"

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
#
# NOTE: this alone does not actually install anything once
# build.jobs.build.html is set above - see jobs.post_install, which does the
# real `pip install .`. Left here mainly for RTD's dashboard/tooling to
# still see the declared install method.
python:
   install:
   - method: pip
     path: .
